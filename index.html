<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Subtraction Adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Kids -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        .animate-pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-200 via-emerald-100 to-amber-100 text-slate-800 h-screen max-h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- TOP HEADER -->
    <header class="px-3 py-2 sm:px-4 sm:py-3 bg-white/80 backdrop-blur-md border-b-4 border-amber-300 shadow-sm flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center gap-2">
            <button onclick="showScreen('welcome')" class="p-2 sm:p-2.5 rounded-2xl bg-amber-400 hover:bg-amber-500 active:scale-95 transition text-white shadow-md flex items-center justify-center cursor-pointer min-w-[42px] min-h-[42px]" title="Main Menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </button>
            <div class="flex items-center gap-1.5 sm:gap-2">
                <span class="text-2xl sm:text-3xl">🍓</span>
                <h1 class="font-bold text-base sm:text-xl md:text-2xl text-emerald-800 tracking-wide">
                    Fruit Subtraction
                </h1>
            </div>
        </div>

        <!-- Question Counter Badge -->
        <div id="question-badge" class="hidden flex items-center gap-1.5 bg-amber-100 px-3 py-1 rounded-full border-2 border-amber-300 font-bold text-amber-800 text-xs sm:text-base">
            <span>Question</span>
            <span id="current-q-num" class="text-base sm:text-lg text-amber-900 font-extrabold">1</span>
            <span class="text-amber-500">/</span>
            <span id="total-q-num">10</span>
        </div>

        <!-- Audio Controls -->
        <div class="flex items-center gap-2">
            <button onclick="toggleSound()" id="sound-btn" class="p-2 sm:p-2.5 rounded-2xl bg-sky-500 hover:bg-sky-600 active:scale-95 transition text-white shadow-md flex items-center justify-center cursor-pointer min-w-[42px] min-h-[42px]" title="Sound FX">
                <svg id="sound-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER (Fixed fit 1 screen) -->
    <main class="flex-1 w-full max-w-4xl mx-auto p-2 sm:p-4 flex flex-col items-center justify-between min-h-0 overflow-hidden relative">

        <!-- 1. WELCOME SCREEN (Simple & Fun) -->
        <section id="screen-welcome" class="w-full h-full flex flex-col items-center justify-around py-4 animate-pop-in">
            <!-- Title -->
            <div class="text-center space-y-2">
                <h2 class="text-3xl sm:text-5xl md:text-6xl font-black text-emerald-700 drop-shadow-sm tracking-wide">
                    Fruit Subtraction Adventure! 🍎
                </h2>
            </div>

            <!-- Big Interactive Floating Fruits -->
            <div class="flex items-center justify-center gap-3 sm:gap-6 my-2 flex-wrap">
                <button onclick="playPopSound()" class="text-5xl sm:text-7xl md:text-8xl animate-float hover:scale-125 transition transform cursor-pointer">🍎</button>
                <button onclick="playPopSound()" class="text-5xl sm:text-7xl md:text-8xl animate-float hover:scale-125 transition transform cursor-pointer" style="animation-delay: 0.5s;">🍊</button>
                <button onclick="playPopSound()" class="text-5xl sm:text-7xl md:text-8xl animate-float hover:scale-125 transition transform cursor-pointer" style="animation-delay: 1s;">🍌</button>
                <button onclick="playPopSound()" class="text-5xl sm:text-7xl md:text-8xl animate-float hover:scale-125 transition transform cursor-pointer" style="animation-delay: 1.5s;">🍓</button>
            </div>

            <!-- Big Start Button -->
            <button onclick="startGame()" class="w-full max-w-md py-4 sm:py-5 px-8 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-95 text-white text-2xl sm:text-4xl font-black rounded-3xl shadow-xl hover:shadow-2xl transition border-b-8 border-emerald-700 flex items-center justify-center gap-4 cursor-pointer">
                <svg class="w-8 h-8 sm:w-10 sm:h-10 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                START GAME!
            </button>
        </section>

        <!-- 2. GAME PLAYING SCREEN -->
        <section id="screen-playing" class="hidden w-full h-full flex flex-col items-center justify-between gap-2 min-h-0 overflow-hidden">
            
            <!-- Fruit Display Board -->
            <div id="fruit-board" class="w-full bg-white/80 backdrop-blur-md rounded-2xl md:rounded-3xl p-2 sm:p-3 md:p-4 border-4 border-amber-300 shadow-xl flex flex-col items-center justify-between min-h-0 flex-1 overflow-hidden">
                
                <!-- Math Equation Title -->
                <div class="shrink-0 text-xl sm:text-3xl font-extrabold text-slate-700 bg-amber-100/90 px-5 py-1 sm:py-1.5 rounded-xl border border-amber-300 flex items-center gap-2 shadow-xs">
                    <span id="equation-total" class="text-emerald-700">12</span>
                    <span>−</span>
                    <span id="equation-subtract" class="text-red-500">4</span>
                    <span>=</span>
                    <span class="text-indigo-600 font-black">?</span>
                </div>

                <!-- Fruit Grid -->
                <div id="fruit-grid" class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 md:gap-4 my-auto w-full max-w-xs sm:max-w-md mx-auto content-center overflow-hidden shrink-0 py-1">
                    <!-- Fruits injected via JavaScript -->
                </div>

                <!-- Counter Helper text -->
                <div class="shrink-0 text-xs sm:text-sm font-semibold text-slate-500 bg-white/60 px-3 py-0.5 rounded-full border border-slate-200">
                    Crossed: <span id="crossed-count" class="text-red-500 font-extrabold">0</span> of <span id="target-count" class="text-slate-700 font-extrabold">4</span> target fruits
                </div>
            </div>

            <!-- Answer Choices Bar -->
            <div class="w-full max-w-2xl flex flex-col items-center gap-1 shrink-0 z-20 pb-1">
                <div class="flex items-center gap-1.5 bg-indigo-100/90 px-3 py-0.5 rounded-full border border-indigo-200 text-indigo-900 text-xs sm:text-sm font-extrabold shadow-xs">
                    <span>💡</span>
                    <span>Choose Answer:</span>
                </div>
                <div id="choices-container" class="grid grid-cols-3 gap-2 sm:gap-4 w-full">
                    <!-- Choice buttons generated via JavaScript -->
                </div>
            </div>
        </section>

        <!-- 3. SUMMARY SCREEN -->
        <section id="screen-summary" class="hidden w-full h-full flex flex-col items-center justify-center p-4 animate-pop-in">
            <div class="bg-white/95 backdrop-blur-xl rounded-3xl p-6 sm:p-8 text-center max-w-md w-full shadow-2xl border-4 border-amber-300 flex flex-col items-center gap-4">
                <div class="text-6xl sm:text-7xl">🏆</div>
                <h2 class="text-3xl sm:text-4xl font-black text-amber-600">Fantastic Job!</h2>
                <p class="text-lg sm:text-xl font-bold text-emerald-700">You Are a Math Star! ⭐</p>
                
                <div class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200 w-full text-center">
                    <p class="text-slate-600 font-semibold text-sm sm:text-base">Your Final Score</p>
                    <p id="final-score" class="text-4xl sm:text-5xl font-black text-amber-600 my-1">10 / 10</p>
                </div>

                <button onclick="startGame()" class="w-full py-3.5 px-6 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-black text-xl sm:text-2xl rounded-2xl shadow-lg border-b-4 border-emerald-700 transition cursor-pointer flex items-center justify-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Play Again
                </button>
            </div>
        </section>

    </main>

    <!-- FEEDBACK OVERLAY MODAL -->
    <div id="feedback-modal" class="hidden fixed inset-0 bg-black/30 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div id="feedback-card" class="bg-white rounded-3xl p-6 sm:p-8 max-w-xs w-full text-center shadow-2xl border-4 flex flex-col items-center gap-3 animate-pop-in">
            <div id="feedback-icon" class="text-5xl sm:text-6xl">⭐</div>
            <h3 id="feedback-text" class="text-2xl sm:text-3xl font-black">Great Job!</h3>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // FRUIT POOL DEFINITIONS
        const FRUIT_POOL = [
            { name: 'apple', emoji: '🍎', borderColor: 'border-red-300' },
            { name: 'orange', emoji: '🍊', borderColor: 'border-orange-300' },
            { name: 'banana', emoji: '🍌', borderColor: 'border-yellow-300' },
            { name: 'strawberry', emoji: '🍓', borderColor: 'border-rose-300' },
            { name: 'grape', emoji: '🍇', borderColor: 'border-purple-300' },
            { name: 'watermelon', emoji: '🍉', borderColor: 'border-emerald-300' },
            { name: 'pineapple', emoji: '🍍', borderColor: 'border-amber-300' },
            { name: 'pear', emoji: '🍐', borderColor: 'border-lime-300' }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let crossedFruits = {};
        let score = 0;
        let isSoundOn = true;

        // WEB AUDIO SYNTHESIZER FOR SOUNDS
        function playPopSound() {
            if (!isSoundOn) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.001, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.05);
            } catch(e){}
        }

        function playSuccessSound() {
            if (!isSoundOn) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.08);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + idx * 0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.08);
                    osc.stop(ctx.currentTime + idx * 0.08 + 0.2);
                });
            } catch(e){}
        }

        function playWrongSound() {
            if (!isSoundOn) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.2);
            } catch(e){}
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('sound-btn').className = isSoundOn 
                ? "p-2 sm:p-2.5 rounded-2xl bg-sky-500 text-white shadow-md flex items-center justify-center cursor-pointer min-w-[42px] min-h-[42px]"
                : "p-2 sm:p-2.5 rounded-2xl bg-slate-300 text-slate-600 shadow-md flex items-center justify-center cursor-pointer min-w-[42px] min-h-[42px]";
        }

        function generateQuestions(count = 10) {
            const list = [];
            const shuffled = [...FRUIT_POOL].sort(() => Math.random() - 0.5);

            for (let i = 0; i < count; i++) {
                const fruit = shuffled[i % shuffled.length];
                const total = Math.floor(Math.random() * 6) + 10; // Total 10-15
                // Ensure subtrahend is never greater than 10
                const maxSubtract = Math.min(10, total - 1);
                const subtract = Math.floor(Math.random() * (maxSubtract - 2 + 1)) + 2; // Subtract 2..10
                const answer = total - subtract;

                const wrongSet = new Set();
                while (wrongSet.size < 2) {
                    const delta = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 2) + 1);
                    const wrong = answer + delta;
                    if (wrong > 0 && wrong !== answer && wrong <= 15) {
                        wrongSet.add(wrong);
                    }
                }
                const choices = [answer, ...Array.from(wrongSet)].sort(() => Math.random() - 0.5);

                list.push({ total, subtract, answer, choices, ...fruit });
            }
            return list;
        }

        // NAVIGATION CONTROL
        function showScreen(screenId) {
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-playing').classList.add('hidden');
            document.getElementById('screen-summary').classList.add('hidden');
            document.getElementById('question-badge').classList.add('hidden');

            document.getElementById(`screen-${screenId}`).classList.remove('hidden');

            if (screenId === 'playing') {
                document.getElementById('question-badge').classList.remove('hidden');
            }
        }

        function startGame() {
            playPopSound();
            questions = generateQuestions(10);
            currentQuestionIndex = 0;
            score = 0;
            showScreen('playing');
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const q = questions[currentQuestionIndex];
            crossedFruits = {};

            document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
            document.getElementById('total-q-num').textContent = questions.length;
            document.getElementById('equation-total').textContent = q.total;
            document.getElementById('equation-subtract').textContent = q.subtract;
            document.getElementById('target-count').textContent = q.subtract;

            const board = document.getElementById('fruit-board');
            board.className = `w-full bg-white/80 backdrop-blur-md rounded-2xl md:rounded-3xl p-2 sm:p-3 md:p-4 border-4 ${q.borderColor} shadow-xl flex flex-col items-center justify-between min-h-0 flex-1 overflow-hidden`;

            // Render Fruits - Guarantee all fit on 1 screen without scrolling
            const fruitGrid = document.getElementById('fruit-grid');
            fruitGrid.innerHTML = '';
            
            // Adjust sizing dynamically based on total quantity to fit screen nicely
            let sizeClass = "w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 text-3xl sm:text-4xl md:text-5xl";
            if (q.total > 12) {
                sizeClass = "w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-2xl sm:text-3xl md:text-4xl";
            } else if (q.total > 10) {
                sizeClass = "w-9 h-9 sm:w-11 sm:h-11 md:w-13 md:h-13 text-2xl sm:text-3xl md:text-4xl";
            }

            for (let i = 0; i < q.total; i++) {
                const btn = document.createElement('button');
                btn.className = `relative ${sizeClass} flex items-center justify-center transition-all transform active:scale-90 hover:scale-110 cursor-pointer shrink-0 select-none`;
                btn.innerHTML = `<span>${q.emoji}</span>`;
                btn.onclick = () => toggleFruitCross(i, btn);
                fruitGrid.appendChild(btn);
            }

            updateCrossedCount();

            // Render 3 Distinct Colored Answer Choice Buttons (Numbers Only)
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            const choiceStyles = [
                'bg-amber-100 hover:bg-amber-200 border-amber-400 text-amber-900',
                'bg-sky-100 hover:bg-sky-200 border-sky-400 text-sky-900',
                'bg-purple-100 hover:bg-purple-200 border-purple-400 text-purple-900'
            ];
            
            q.choices.forEach((choice, idx) => {
                const choiceBtn = document.createElement('button');
                const styleClass = choiceStyles[idx % choiceStyles.length];
                choiceBtn.className = `py-2.5 sm:py-3.5 rounded-2xl text-2xl sm:text-4xl font-black transition-all shadow-lg border-b-4 active:border-b-0 active:translate-y-1 flex items-center justify-center ${styleClass} border-2 w-full animate-pop-in cursor-pointer min-h-[52px] sm:min-h-[64px]`;
                
                choiceBtn.innerHTML = `<span>${choice}</span>`;
                choiceBtn.onclick = () => handleAnswerSelect(choice, q.answer, choiceBtn);
                choicesContainer.appendChild(choiceBtn);
            });
        }

        function toggleFruitCross(index, btnElement) {
            playPopSound();
            crossedFruits[index] = !crossedFruits[index];

            const q = questions[currentQuestionIndex];
            let sizeClass = "w-10 h-10 sm:w-12 sm:h-12 md:w-14 md:h-14 text-3xl sm:text-4xl md:text-5xl";
            if (q.total > 12) {
                sizeClass = "w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 text-2xl sm:text-3xl md:text-4xl";
            } else if (q.total > 10) {
                sizeClass = "w-9 h-9 sm:w-11 sm:h-11 md:w-13 md:h-13 text-2xl sm:text-3xl md:text-4xl";
            }

            if (crossedFruits[index]) {
                btnElement.className = `relative ${sizeClass} flex items-center justify-center transition-all transform active:scale-90 opacity-40 scale-95 cursor-pointer shrink-0 select-none`;
                const crossDiv = document.createElement('div');
                crossDiv.id = `cross-${index}`;
                crossDiv.className = `absolute inset-0 flex items-center justify-center pointer-events-none`;
                crossDiv.innerHTML = `<svg class="w-full h-full p-0.5 text-red-500 stroke-[4] drop-shadow-md animate-pop-in" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;
                btnElement.appendChild(crossDiv);
            } else {
                btnElement.className = `relative ${sizeClass} flex items-center justify-center transition-all transform active:scale-90 hover:scale-110 cursor-pointer shrink-0 select-none`;
                const existingCross = document.getElementById(`cross-${index}`);
                if (existingCross) existingCross.remove();
            }

            updateCrossedCount();
        }

        function updateCrossedCount() {
            const count = Object.values(crossedFruits).filter(Boolean).length;
            document.getElementById('crossed-count').textContent = count;
        }

        function handleAnswerSelect(userChoice, correctAnswer, btnElement) {
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');

            if (userChoice === correctAnswer) {
                playSuccessSound();
                score++;
                card.className = "bg-white rounded-3xl p-6 sm:p-8 max-w-xs w-full text-center shadow-2xl border-4 border-emerald-400 flex flex-col items-center gap-3 animate-pop-in";
                icon.textContent = "⭐";
                text.className = "text-2xl sm:text-3xl font-black text-emerald-600";
                text.textContent = "Awesome!";
                btnElement.classList.add('bg-emerald-500', 'text-white');
            } else {
                playWrongSound();
                card.className = "bg-white rounded-3xl p-6 sm:p-8 max-w-xs w-full text-center shadow-2xl border-4 border-rose-400 flex flex-col items-center gap-3 animate-pop-in";
                icon.textContent = "💪";
                text.className = "text-2xl sm:text-3xl font-black text-rose-600";
                text.textContent = "Try Again!";
                btnElement.classList.add('bg-rose-500', 'text-white');
            }

            modal.classList.remove('hidden');

            setTimeout(() => {
                modal.classList.add('hidden');
                if (userChoice === correctAnswer) {
                    if (currentQuestionIndex + 1 < questions.length) {
                        currentQuestionIndex++;
                        renderCurrentQuestion();
                    } else {
                        document.getElementById('final-score').textContent = `${score} / ${questions.length}`;
                        showScreen('summary');
                    }
                }
            }, 1400);
        }
    </script>
</body>
</html>
